<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기획전 템플릿 · 비개발자가 만드는 기획전</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f8;color:#171a22;font:14px/1.5 "Inter","Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px;display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
h1{grid-column:1/-1;margin:0;font-size:16px;letter-spacing:-.01em}
h1 small{display:block;margin-top:2px;color:#6b7385;font-size:12px;font-weight:400}
.panel{display:grid;gap:12px;padding:18px;border:1px solid #e3e7f0;border-radius:14px;background:#fff}
label{display:grid;gap:5px;font-size:12px;font-weight:700;color:#4a5163}
input[type=text],select{padding:10px 12px;border:1px solid #d8dde9;border-radius:8px;font:inherit;color:#171a22}
input[type=range]{width:100%}
.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tpl button{padding:9px 4px;border:1px solid #d8dde9;border-radius:8px;background:#fff;font:700 12px inherit;cursor:pointer}
.tpl button[aria-pressed=true]{border-color:#2f6fed;background:#eaf1ff;color:#2f6fed}
.sw{display:flex;gap:6px}
.sw button{width:30px;height:30px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #d8dde9;cursor:pointer}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px #171a22}
.out{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;background:#f3f4f8;font-size:12px;color:#4a5163}
.copy{padding:11px;border:0;border-radius:8px;background:#171a22;color:#fff;font:700 13px inherit;cursor:pointer}
.prev{border:1px solid #e3e7f0;border-radius:14px;background:#fff;overflow:hidden}
.prev__bar{padding:8px 12px;border-bottom:1px solid #e3e7f0;background:#fafbfd;font:500 11px ui-monospace,monospace;color:#6b7385}
.event{--c:#2f6fed;padding:0 0 22px}
.hero{padding:44px 28px;background:var(--c);color:#fff;text-align:center;transition:.3s}
.hero h2{margin:0;font-size:30px;line-height:1.25;letter-spacing:-.02em}
.hero p{margin:8px 0 0;opacity:.9}
.hero .tag{display:inline-block;margin-bottom:12px;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-size:12px;font-weight:700}
.items{display:grid;gap:14px;padding:22px 22px 0}
.items.g3{grid-template-columns:repeat(3,1fr)}.items.g2{grid-template-columns:repeat(2,1fr)}.items.l1{grid-template-columns:1fr}
.item{display:grid;gap:8px}
.item.l{grid-template-columns:96px 1fr;align-items:center}
.ph{aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,#eef1f8,#dfe5f2)}
.item.l .ph{aspect-ratio:1;width:96px}
.n{height:10px;width:70%;border-radius:5px;background:#dfe5f2}.n.s{width:40%;background:var(--c);opacity:.7}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.items.g3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>기획전 템플릿<small>MD 같은 비개발자도 입력만으로 기획전 페이지를 만드는 템플릿 시스템의 개념 데모 · 샘플 데이터</small></h1>
  <div class="panel">
    <label>템플릿
      <div class="tpl" id="tpl"><button data-t="g3" aria-pressed="true">3열 그리드</button><button data-t="g2" aria-pressed="false">2열 그리드</button><button data-t="l1" aria-pressed="false">리스트</button></div>
    </label>
    <label>배지 문구<input type="text" id="tag" value="기획전"></label>
    <label>제목<input type="text" id="title" value="가을 시즌 특가 기획전"></label>
    <label>부제<input type="text" id="sub" value="오늘만 만나는 최대 30% 혜택"></label>
    <label>대표 색상
      <div class="sw" id="sw"></div>
    </label>
    <label><span>상품 수 <b id="cnt-v">6</b>개</span><input type="range" id="cnt" min="2" max="12" value="6"></label>
    <div class="out"><span>생성된 HTML</span><b id="size">0 B</b></div>
    <button class="copy" id="copy" type="button">HTML 복사</button>
  </div>
  <div class="prev">
    <div class="prev__bar">PREVIEW · 입력하면 바로 반영됩니다</div>
    <div class="event" id="ev"></div>
  </div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var colors = ["#2f6fed", "#12b886", "#e5484d", "#7c5cff", "#f08c00"];
  var state = { t: "g3", c: colors[0] };
  $("sw").innerHTML = colors.map(function (c, i) { return '<button type="button" style="background:' + c + '" data-c="' + c + '" aria-pressed="' + (i === 0) + '" aria-label="색상 ' + (i + 1) + '"></button>'; }).join("");
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function build() {
    var n = +$("cnt").value, list = state.t === "l1";
    var items = "";
    for (var i = 0; i < n; i++) {
      items += '<div class="item' + (list ? " l" : "") + '"><div class="ph"></div><div><div class="n"></div><div class="n s" style="margin-top:6px"></div></div></div>';
    }
    return '<div class="event" style="--c:' + state.c + '"><div class="hero"><span class="tag">' + esc($("tag").value) + '</span><h2>' + esc($("title").value) + '</h2><p>' + esc($("sub").value) + '</p></div><div class="items ' + state.t + '">' + items + '</div></div>';
  }
  function render() {
    var html = build();
    $("ev").outerHTML = html.replace('class="event"', 'class="event" id="ev"');
    $("cnt-v").textContent = $("cnt").value;
    $("size").textContent = new Blob([html]).size + " B";
  }
  document.addEventListener("input", render);
  $("tpl").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; state.t = b.dataset.t; document.querySelectorAll("#tpl button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); render(); };
  $("sw").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; state.c = b.dataset.c; document.querySelectorAll("#sw button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); render(); };
  $("copy").onclick = function () {
    var html = build(), done = function () { $("copy").textContent = "복사됨 ✓"; setTimeout(function () { $("copy").textContent = "HTML 복사"; }, 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(html).then(done, done); else done();
  };
  render();
})();
</script>
</body>
</html>
